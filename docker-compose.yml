version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bike_lover_postgres
    restart: always
    environment:
      POSTGRES_USER: bikelover
      POSTGRES_PASSWORD: BikeL0ver@2024
      POSTGRES_DB: bike_lover_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikelover -d bike_lover_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bike_lover_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://bikelover:BikeL0ver@2024@postgres:5432/bike_lover_db
      JWT_SECRET: bike-lover-enterprise-secret-key-super-secure-32-chars-long
      JWT_REFRESH_SECRET: bike-lover-refresh-secret-key-32-chars-long
      FRONTEND_URL: http://localhost:3000
      UPLOAD_DIR: ./uploads
      BACKUP_DIR: ./backups
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
